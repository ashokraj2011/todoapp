          validFor: null
          revalidateAt: []
        gate: warn
        approval:
          mode: bundle
          authorities: []
          minimum: 1
          allowSelfApproval: true
    bundleApproval:
      mode: none
      authorities: []
      minimum: 0
      allowSelfApproval: true
