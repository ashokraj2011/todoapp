version: 1
initiativeRoot: singularity/initiatives
templatesRoot: singularity/templates
contextPolicy:
  onApproval: new
  onRejection: keep
  phaseOverrides: {}
git:
  remote: origin
  publish: required
identity:
  authority: local
  configurablePerEpic: true
  local:
    epicPrefix: SF-E
    storyPrefix: SF-S
    pad: 3
    scopeStoriesByEpic: true
jira:
  enabled: false
  pinAttachments: true
  connection: corporate-jira
  deployment: cloud
  allowedHosts: []
  allowedProjects: []
  authentication:
    permitted:
      - user-token
      - service-account
    tokenExpiryWarningDays: 14
  read:
    epics: true
    stories: true
    attachmentPolicy: metadata-only
    cacheMinutes: 10
  write: false
  writeMode: off
  writePolicy:
    mode: off
    operations:
      - create-epic
      - create-story
      - create-subtask
      - update-owned-fields
      - add-comment
      - attach-artifact
      - set-lineage-property
    allowedFields:
      - summary
      - description
      - parent
      - labels
      - components
    forbiddenFields:
      - status
      - assignee
      - sprint
      - priority
      - resolution
  projectKey: ""
  epicIssueType: Epic
  storyIssueType: Story
  subtaskIssueType: Sub-task
approvalAuthorities:
  initiative-owners:
    members:
      - name: Ashok Raj
        email: 88361104+ashokraj2011@users.noreply.github.com
  product-approvers:
    members:
      - name: Ashok Raj
        email: 88361104+ashokraj2011@users.noreply.github.com
  architecture-reviewers:
    members:
      - name: Ashok Raj
        email: 88361104+ashokraj2011@users.noreply.github.com
  risk-reviewers:
    members:
      - name: Ashok Raj
        email: 88361104+ashokraj2011@users.noreply.github.com
  operations-reviewers:
    members:
      - name: Ashok Raj
        email: 88361104+ashokraj2011@users.noreply.github.com
repositories:
  ToDOAPP:
    url: https://github.com/ashokraj2011/todoapp.git
    defaultBranch: main
    required: true
    metadata:
      name: repository
      appId: AP12345
    branchCompletionPolicy: pr
    requiredChecks: []
    jira:
      projectKey: null
      boardId: null
repositoryMetadata:
  requiredKeys: []
  patterns:
    appId: ^[A-Z0-9-]{3,32}$
storage:
  defaultProvider: jira
  maxBytes: 104857600
  allowedMimeTypes: []
  providers:
    jira:
      type: jira-attachment
      maxBytes: null
      allowedMimeTypes: []
initiativeProfiles:
  epic-planning:
    label: Epic planning
    description: Ground an Epic, approve traceable requirements, approve an editable
      Story/specification package, and publish Jira/Git Stories.
    lifecycleMode: planning-only
    phases:
      - epic-intake
      - epic-requirements
      - epic-planning
      - epic-publish
  initiative-lite:
    label: Initiative lite
    description: Four governed phases for smaller cross-repository initiatives.
    lifecycleMode: full-delivery
    phases:
      - define
      - plan
      - build
      - release
  enterprise-delivery:
    label: Enterprise delivery
    description: Seven phase gates for complex regulated or multi-team delivery.
    lifecycleMode: full-delivery
    phases:
      - discover-define
      - design-iterate
      - pre-inception
      - inception
      - elaboration
      - construction
      - delivery
initiativePhases:
