        required: false
        approval:
          mode: bundle
          authorities: []
          minimum: 1
          allowSelfApproval: true
    checklist:
      - id: epic-identity-verified
        label: Epic identity reserved and verified
        requirement: optional
        applicability: null
        acceptedAssurance:
          - machine-verified
          - system-verified
        freshness:
          validFor: null
          revalidateAt: []
        gate: warn
        approval:
          mode: bundle
          authorities: []
          minimum: 1
          allowSelfApproval: true
